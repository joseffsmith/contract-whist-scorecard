name: Mobile

# Builds the Capacitor app in mobile/ (see mobile/README.md). The first two
# jobs prove the app still compiles. Started by hand ("Run workflow"),
# `testflight` (experimental) ships an iOS build and `play` a signed Android
# bundle to Play internal testing, each only when its secrets are set.
on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "src/**"
      - "shared/**"
      - "public/**"
      - "index.html"
      - "vite.config.ts"
      - "tsconfig.json"
      - ".env.mobile"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "mobile/**"
      - "src/**"
      - "shared/**"
      - "public/**"
      - "index.html"
      - "vite.config.ts"
      - "tsconfig.json"
      - ".env.mobile"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

# A newer push replaces a build still running for the same ref. Manual runs
# (TestFlight) have their own group, so a push never cancels one halfway.
concurrency:
  group: mobile-${{ github.event_name == 'workflow_dispatch' && 'manual-' || '' }}${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

# The macOS image and Xcode are pinned so a runner update can't change the
# build; bump both together (App Store uploads need a recent Xcode).
env:
  XCODE_VERSION: "26.0.1"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run build:mobile
      - run: npm ci
        working-directory: mobile
      - run: npx cap sync android
        working-directory: mobile
      - run: ./gradlew assembleDebug -PversionCode=${{ github.run_number }}
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: whist-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
      # Proves release signing works, with a throwaway key (the real upload key
      # is only used by the `play` job).
      - name: Signed release bundle (throwaway key)
        working-directory: mobile/android
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/test.jks" -alias test \
            -keyalg RSA -keysize 2048 -validity 1 -storepass testtest -keypass testtest \
            -dname "CN=CI test"
          ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/test.jks" ANDROID_KEYSTORE_PASSWORD=testtest \
          ANDROID_KEY_ALIAS=test ANDROID_KEY_PASSWORD=testtest \
            ./gradlew bundleRelease -PversionCode=${{ github.run_number }}
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab | grep "jar verified"

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - run: npm ci
      - run: npm run build:mobile
      - run: npm ci
        working-directory: mobile
      - run: npx cap sync ios
        working-directory: mobile
      # Compile for the simulator without signing, to prove the project builds.
      - name: Build for the iOS Simulator
        working-directory: mobile/ios/App
        run: |
          xcodebuild build \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

  # Secrets can't be tested in a job's `if`, so look for them here first.
  testflight-check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::TestFlight skipped: set ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 and APPLE_TEAM_ID (see mobile/README.md)."
          fi

  testflight:
    needs: testflight-check
    if: needs.testflight-check.outputs.ready == 'true'
    runs-on: macos-15
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - run: npm ci
      - run: npm run build:mobile
      - run: npm ci
        working-directory: mobile
      - run: npx cap sync ios
        working-directory: mobile
      - name: Write the App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"
      - name: Archive
        working-directory: mobile/ios/App
        run: |
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Whist.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"
      # destination=upload sends the build to App Store Connect (TestFlight)
      # straight from exportArchive; no .ipa is kept.
      - name: Export and upload
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Whist.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Remove the API key
        if: always()
        run: rm -f "$ASC_KEY_PATH"

  # Google Play: a signed release bundle with the real upload key, uploaded to
  # the internal testing track when a Play service account is set (otherwise
  # kept as an artifact to upload by hand). Started by hand, like TestFlight.
  play-check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      upload: ${{ steps.check.outputs.upload }}
    steps:
      - id: check
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Play build skipped: set ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD (see mobile/README.md)."
          fi
          if [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "upload=true" >> "$GITHUB_OUTPUT"
          else
            echo "upload=false" >> "$GITHUB_OUTPUT"
          fi

  play:
    needs: play-check
    if: needs.play-check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run build:mobile
      - run: npm ci
        working-directory: mobile
      - run: npx cap sync android
        working-directory: mobile
      - name: Write the upload key
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      # versionCode = run number + 100, so CI builds always outrank the first
      # bundles uploaded by hand.
      - name: Signed release bundle
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease -PversionCode=$(( ${{ github.run_number }} + 100 ))
      - name: Remove the upload key
        if: always()
        run: rm -f "$ANDROID_KEYSTORE_PATH"
      - uses: actions/upload-artifact@v4
        with:
          name: whist-release-aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
      # Play only accepts API uploads once the app's first release was made in
      # Play Console by hand (see mobile/README.md).
      - name: Upload to Play (internal testing)
        if: needs.play-check.outputs.upload == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: uk.joseffsmith.whist
          releaseFiles: mobile/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
