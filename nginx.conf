server {
  listen 80;
  root /usr/share/nginx/html;
  # Behind Coolify's proxy: keep redirects relative so they use the public host.
  absolute_redirect off;

  # nginx's default mime.types doesn't know the PWA manifest.
  include /etc/nginx/mime.types;
  types {
    application/manifest+json webmanifest;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

  location = / {
    return 302 /contract-whist/;
  }

  location = /contract-whist {
    return 301 /contract-whist/;
  }

  # Hashed build output — safe to cache forever.
  location ^~ /contract-whist/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The API (server/src), started alongside nginx. Its last X-Forwarded-For
  # entry is the real client IP, so pass on the host nginx's header as-is.

  # Live updates: a long-lived event stream that must not be buffered.
  location ^~ /contract-whist/api/sync/stream {
    proxy_pass http://127.0.0.1:3001/sync/stream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    gzip off;
    add_header X-Accel-Buffering no;
    add_header Cache-Control "no-store";
  }

  # Queued actions from the phones can be a few hundred KB.
  location = /contract-whist/api/sync/push {
    proxy_pass http://127.0.0.1:3001/sync/push;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    client_max_body_size 256k;
  }

  # One-off InstantDB import (disabled in the app unless IMPORT_TOKEN is set).
  location = /contract-whist/api/admin/import {
    proxy_pass http://127.0.0.1:3001/admin/import;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    client_max_body_size 20m;
  }

  location ^~ /contract-whist/api/ {
    proxy_pass http://127.0.0.1:3001/;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    client_max_body_size 16k;
  }

  # Everything else (index.html, sw.js, manifest) must revalidate so new
  # deploys reach installed PWAs. Unknown paths fall back to the SPA.
  location ^~ /contract-whist/ {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /contract-whist/index.html;
  }
}
