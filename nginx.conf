server {
  listen 80;
  root /usr/share/nginx/html;
  # Behind Coolify's proxy: keep redirects relative so they use the public host.
  absolute_redirect off;

  # nginx's default mime.types doesn't know the PWA manifest.
  include /etc/nginx/mime.types;
  types {
    application/manifest+json webmanifest;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

  location = / {
    return 302 /contract-whist/;
  }

  location = /contract-whist {
    return 301 /contract-whist/;
  }

  # Hashed build output — safe to cache forever.
  location ^~ /contract-whist/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Password sign-in service (server/auth.mjs), started alongside nginx.
  location ^~ /contract-whist/api/ {
    proxy_pass http://127.0.0.1:3001/;
    # Pass on the host nginx's header as-is: its last entry is the real
    # client IP, used for rate limiting.
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    client_max_body_size 16k;
  }

  # Everything else (index.html, sw.js, manifest) must revalidate so new
  # deploys reach installed PWAs. Unknown paths fall back to the SPA.
  location ^~ /contract-whist/ {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /contract-whist/index.html;
  }
}
